<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Report Filler</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="appbar">
      <h1>Lab Report Filler</h1>
      <span class="version" id="version"></span>
      <span class="save-state" id="save-state"></span>
      <span class="spacer"></span>
      <div id="accent-picker" class="accents" role="radiogroup" aria-label="Accent colour"></div>
      <button id="theme-toggle" type="button" aria-label="Switch to light theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g class="icon-sun">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </g>
          <path class="icon-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </header>

    <nav class="tabbar" role="tablist">
      <button class="tab" role="tab" data-tab="report" aria-selected="true">Lab report</button>
      <button class="tab" role="tab" data-tab="labs" aria-selected="false">My labs</button>
      <span class="spacer"></span>
      <button id="preview-toggle" class="tab-action" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="3" width="14" height="18" rx="2" />
          <path d="M9 8h6M9 12h6M9 16h3" />
        </svg>
        Preview
      </button>
    </nav>

    <main>
      <!-- The form on the left, the document on the right, a drag handle
           between them. On a narrow window the stylesheet turns the same
           two columns into one screen you flip with the Preview button. -->
      <section class="panel split-panel" id="panel-report" role="tabpanel">
        <div class="split" id="report-split" data-preview="on">
          <div class="form-col">
            <div class="wrap" id="report-sections"></div>
          </div>
          <aside class="preview-col" id="preview-col" aria-label="Live document preview"></aside>
        </div>
      </section>

      <section class="panel" id="panel-labs" role="tabpanel" hidden>
        <div class="wrap" id="labs-sections"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
