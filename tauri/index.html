<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Report Filler</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="appbar">
      <h1>Lab Report Filler</h1>
      <span class="version" id="version"></span>
      <span class="spacer"></span>
      <div id="accent-picker" class="accents" role="radiogroup" aria-label="Accent colour"></div>
      <button id="theme-toggle" type="button" aria-label="Switch to light theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g class="icon-sun">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </g>
          <path class="icon-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </header>

    <nav class="tabbar" role="tablist">
      <button class="tab" role="tab" data-tab="report" aria-selected="true">Lab report</button>
      <button class="tab" role="tab" data-tab="trig" aria-selected="false">Trigonometry</button>
    </nav>

    <main>
      <section class="tabpanel" id="panel-report" role="tabpanel">
        <div class="wrap" id="report-sections"></div>
      </section>

      <section class="tabpanel" id="panel-trig" role="tabpanel" hidden>
        <div class="wrap" id="trig-sections"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
